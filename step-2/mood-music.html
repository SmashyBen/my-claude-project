<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mood Music</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20vh 2rem 2rem;
      background: #0f0f14;
      color: #e8e8f0;
      transition: background 0.6s ease, color 0.6s ease;
    }

    h1 {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      margin-bottom: 0.4rem;
      color: var(--accent, #c8b8f8);
      transition: color 0.6s ease;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--subtle, #888);
      margin-bottom: 2.5rem;
      letter-spacing: 0.05em;
      transition: color 0.6s ease;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 460px;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.85rem 1.1rem;
      background: var(--card-bg, #1c1c26);
      border: 1px solid var(--border, #333);
      border-radius: 8px;
      color: var(--text, #e8e8f0);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, background 0.6s, color 0.6s;
    }

    input[type="text"]:focus {
      border-color: var(--accent, #c8b8f8);
    }

    button {
      width: 100%;
      padding: 0.9rem;
      background: var(--accent, #c8b8f8);
      color: var(--btn-text, #0f0f14);
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.2s, color 0.2s;
    }

    button:hover { opacity: 0.85; }

    #result {
      margin-top: 2.5rem;
      width: 100%;
      max-width: 460px;
      display: none;
    }

    .result-card {
      background: var(--card-bg, #1c1c26);
      border: 1px solid var(--border, #333);
      border-radius: 12px;
      padding: 1.8rem;
      transition: background 0.6s, border-color 0.6s;
    }

    .mood-label, .genre-label {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--subtle, #888);
      text-transform: uppercase;
      margin-bottom: 0.3rem;
      transition: color 0.6s;
    }

    .mood-name {
      font-size: 1.5rem;
      color: var(--accent, #c8b8f8);
      margin-bottom: 1.4rem;
      text-transform: capitalize;
      transition: color 0.6s;
    }

    .genre-name {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text, #e8e8f0);
      transition: color 0.6s;
    }

    .vibe {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--subtle, #aaa);
      transition: color 0.6s;
    }

    .no-match {
      color: var(--subtle, #888);
      font-size: 0.95rem;
      text-align: center;
      padding: 1rem 0;
    }

    .try-again {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--subtle, #666);
      text-align: right;
      cursor: pointer;
      letter-spacing: 0.05em;
    }

    .try-again:hover { color: var(--accent, #c8b8f8); }

    .audio-container {
      margin-top: 1.2rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--border, #333);
    }

    .track-credit {
      font-size: 0.75rem;
      color: var(--subtle, #888);
      margin-bottom: 0.6rem;
      letter-spacing: 0.05em;
    }

    .track-credit strong { color: var(--text, #e8e8f0); }

    audio {
      width: 100%;
      height: 32px;
      accent-color: var(--accent, #c8b8f8);
    }

    .jamendo-credit {
      font-size: 0.65rem;
      color: var(--subtle, #666);
      margin-top: 0.4rem;
      letter-spacing: 0.05em;
    }

    .jamendo-credit a { color: inherit; }

    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      width: auto;
      padding: 0.3rem 0.65rem;
      background: transparent;
      border: 1px solid var(--border, #333);
      border-radius: 20px;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0;
      color: var(--subtle, #888);
      cursor: pointer;
      z-index: 100;
      transition: border-color 0.3s, color 0.3s;
    }

    .theme-toggle:hover {
      opacity: 1;
      color: var(--accent, #c8b8f8);
      border-color: var(--accent, #c8b8f8);
    }

    body.light h1 { color: var(--accent, #4a3880); }
    body.light .subtitle { color: var(--subtle, #665577); }
  </style>
</head>

      "Funk / G-Funk":               "funk",

      "Singer-Songwriter / Folk":    "folk",
      "Indie Folk":                  "folk",
      "Blues":                       "blues",
      "House / Dance":               "house",
      "Drum and Bass":               "drumandbass",
      "Punk / Hardcore":             "punk",
      "Modern Classical / Minimalist": "classical",
      "Ambient":                     "ambient",
      "Japanese City Pop":           "pop",
      "Dark Ambient / Gothic":       "darkambient",
      "Black Metal (Atmospheric)":   "blackmetal",
      "Industrial":                  "industrial",
      "Indie Folk / Dreamy Pop":     "folk",
      "Gospel / Gospel Soul":        "gospel",
      "Post-Rock (Uplifting)":       "postrock",
      "Shoegaze / Dream Pop":        "shoegaze",
      "Drone / Ambient":             "drone",
      "Trip-Hop":                    "triphop",
      "Punk / Garage Rock":          "punk",
      "Riot Grrrl":                  "punk",
      "Oi! / Street Punk":           "punk",
    };

    async function loadTrack(genreName) {
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      const container = document.getElementById('audio-container');
      if (!container) return;
      const tags = genreTags[genreName];
      if (!tags) return;
      try {
        const url = `https://api.jamendo.com/v3.0/tracks/?client_id=daf87ec3&format=json&limit=10&tags=${encodeURIComponent(tags)}&audioformat=mp32&order=popularity_total`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          const track = data.results[Math.floor(Math.random() * data.results.length)];
          container.innerHTML = `
            <div class="track-credit"><strong>${track.name}</strong> by ${track.artist_name}</div>
            <audio controls src="${track.audio}"></audio>
            <div class="jamendo-credit">Music via <a href="https://www.jamendo.com" target="_blank">Jamendo</a> · free to stream</div>`;
          const audio = container.querySelector('audio');
          audio.volume = 0.6;
          audio.play().catch(() => {});
          currentAudio = audio;
        }
      } catch (e) { /* silent fail */ }
    }

    function isLight() { return document.body.classList.contains('light'); }

    function applyTheme(moodKey) {
      const palette = isLight() ? lightThemes : themes;
      const t = palette[moodKey] || palette.numb;
      const root = document.documentElement;
      root.style.setProperty('--accent', t.accent);
      root.style.setProperty('--subtle', t.subtle);
      root.style.setProperty('--card-bg', t.card);
      root.style.setProperty('--border', t.border);
      root.style.setProperty('--text', t.text);
      root.style.setProperty('--btn-text', t.btn);
      document.body.style.background = t.bg;
      document.body.style.color = t.text;
    }

    function resetTheme() {
      document.documentElement.style.removeProperty('--accent');
      document.documentElement.style.removeProperty('--subtle');
      document.documentElement.style.removeProperty('--card-bg');
      document.documentElement.style.removeProperty('--border');
      document.documentElement.style.removeProperty('--text');
      document.documentElement.style.removeProperty('--btn-text');
      document.body.style.background = isLight() ? '#f5f3ee' : '#0f0f14';
      document.body.style.color    = isLight() ? '#1a1a2e' : '#e8e8f0';
    }

    function toggleTheme() {
      document.body.classList.toggle('light');
      const btn = document.getElementById('theme-toggle');
      btn.textContent = isLight() ? '☾' : '☀';
      if (lastMood) applyTheme(lastMood); else resetTheme();
    }

    function initTheme() {
      if (window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.body.classList.add('light');
        document.body.style.background = '#f5f3ee';
        document.body.style.color = '#1a1a2e';
        document.getElementById('theme-toggle').textContent = '☾';
      }
    }

    function extractMood(raw) {
      // split on "and", "&", "+" and pick the first recognisable mood
      const parts = raw.toLowerCase().split(/\s+and\s+|&|\+/);
      for (const part of parts) {
        const word = part.trim();
        const key = aliases[word] || word;
        if (moods[key]) return key;
      }
      return null;
    }

    function findMusic() {
      const raw = document.getElementById('moodInput').value.trim();

      if (!raw) { showResult(null, ''); return; }

      const key = extractMood(raw);
      if (!key) { showResult(null, raw); return; }

      // pick a random genre from the pool (different from last if possible)
      const pool = moods[key];
      let idx = Math.floor(Math.random() * pool.length);
      if (pool.length > 1 && lastMood === key && lastPool === idx) {
        idx = (idx + 1) % pool.length;
      }
      lastMood = key;
      lastPool = idx;

      applyTheme(key);
      showResult(pool[idx], key, raw, pool.length > 1);
    }

    function findAnother() {
      if (!lastMood) return;
      const pool = moods[lastMood];
      let idx = Math.floor(Math.random() * pool.length);
      if (pool.length > 1 && lastPool === idx) idx = (idx + 1) % pool.length;
      lastPool = idx;
      const raw = document.getElementById('moodInput').value.trim() || lastMood;
      showResult(pool[idx], lastMood, raw, true);
    }

    document.getElementById('moodInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') findMusic();
    });

    initTheme();

    function showResult(match, mood, raw, showTryAnother) {
      const el = document.getElementById('result');
      el.style.display = 'block';

      if (!match) {
        resetTheme();
        el.innerHTML = `<div class="result-card"><p class="no-match">Hmm, I don't know that one yet. Try the dropdown, or use a simpler word.</p></div>`;
        return;
      }

      const displayMood = raw && raw !== mood ? raw : mood;
      const tryAgainHtml = showTryAnother
        ? `<div class="try-again" onclick="findAnother()">↻ try another genre for this mood</div>`
        : '';

      el.innerHTML = `
        <div class="result-card">
          <div class="mood-label">Your mood</div>
          <div class="mood-name">${displayMood}</div>
          <div class="genre-label">Your sound</div>
          <div class="genre-name">${match.genre}</div>
          <div class="vibe">${match.vibe}</div>
          <div id="audio-container" class="audio-container"></div>
          ${tryAgainHtml}
        </div>`;
      loadTrack(match.genre);
    }
  </script>

</body>
